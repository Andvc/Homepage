<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #fff;
        }

        /* 小猫场景容器 - 正常文档流 */
        .cat-scene-section {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 1800px;
        }

        #catCanvas {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* 主内容区域 */
        .main-content {
            background: #1a1a2e;
        }

        .section {
            min-height: 100vh;
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .section h2 {
            font-size: 3em;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-content {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-content p {
            font-size: 1.2em;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 不同section的背景色 */
        .section:nth-child(odd) {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
        }

        .section:nth-child(even) {
            background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
        }
    </style>
</head>
<body>
    <!-- 小猫场景 - 第一屏 -->
    <div class="cat-scene-section">
        <div class="container">
            <canvas id="catCanvas" width="1600" height="1200"></canvas>
        </div>
    </div>

    <!-- 可滚动的主内容区域 -->
    <div class="main-content">
        <section class="section" id="about">
            <h2>关于我</h2>
            <div class="section-content">
                <p>
                    这里是关于我的介绍内容...
                </p>
                <p style="margin-top: 20px;">
                    您可以在这个区域添加您的个人介绍、技能、经历等信息。
                </p>
            </div>
        </section>

        <section class="section" id="projects">
            <h2>我的作品</h2>
            <div class="section-content">
                <p>
                    这里展示您的项目作品集...
                </p>
                <p style="margin-top: 20px;">
                    可以添加项目卡片、项目描述、技术栈、项目链接等内容。
                </p>
            </div>
        </section>

        <section class="section" id="skills">
            <h2>技能专长</h2>
            <div class="section-content">
                <p>
                    这里展示您的专业技能...
                </p>
                <p style="margin-top: 20px;">
                    可以使用技能图表、进度条、标签云等形式展示您的技能。
                </p>
            </div>
        </section>

        <section class="section" id="contact">
            <h2>联系方式</h2>
            <div class="section-content">
                <p>
                    这里是您的联系方式...
                </p>
                <p style="margin-top: 20px;">
                    可以添加邮箱、社交媒体链接、GitHub、LinkedIn等联系方式。
                </p>
            </div>
        </section>
    </div>

    <script src="catAnimation.js"></script>
</body>
</html>
